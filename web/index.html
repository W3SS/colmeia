<!doctype html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bruno+Ace+SC&family=Orbitron:wght@500;700;900&family=Oxanium:wght@500;700;800&family=Share+Tech+Mono&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bruno+Ace+SC&family=Orbitron:wght@500;700;900&family=Oxanium:wght@500;700;800&family=Share+Tech+Mono&display=swap"></noscript>
<title>Colmeia — Gestor Git de Frotas</title>
<!--
  Colmeia UI · implementação lightweight, zero dependências.
  Servida como asset estático pelo daemon (tiny_http). Sem build, sem npm,
  sem framework, sem CDN. Um único rAF para canvas; SSE simulado por tick.
  Temas: 4 base + 5 retrô + 5 energia + 18 cyberpunk (fontes combinadas por tema).
  Telas: overview/repos/explorar/sync/slice/merge/security/docs/graph/prs/anomaly + branches + testes.
  Explorar: navega o diretório real de repos via API read-only (/api/tree + /api/repo),
  com fallback elegante quando a API está indisponível (servidor estático).
  Menu hambúrguer com abre/fecha. Responsivo: desktop / tablet / mobile.
-->
<style>
/* ═══════════════ TOKENS & TEMAS ═══════════════ */
:root{
  --ac:#F59E0B;
  --bg:#0B0E14; --sf:#131722; --ov:#1A2030; --bd:#232A3A;
  --tx:#E8EAF2; --mu:#8B93A7; --scrim:rgba(4,6,12,.72);
  --ok:#4ADE80; --wa:#F59E0B; --da:#EF4444; --in:#4A9EFF;
  --d1:#4A9EFF; --d2:#A855F7; --d3:#4ADE80; --d4:#F59E0B;
  --d5:#22D3EE; --d6:#EF4444; --d7:#EC4899; --d8:#A3E635;
  --elev:0 1px 3px rgba(0,0,0,.4);
  --shadow-a:none; --shadow-b:none; --border-w:1px;
  --shadow-card:0 1px 2px rgba(0,0,0,.34),0 10px 30px rgba(0,0,0,.30);
  --r:14px; --grid:4px;
  --motion:1; --glow:.6; --density:1; --font:1;
  --micro:calc(120ms*var(--motion)); --base:calc(300ms*var(--motion));
  --enter:calc(400ms*var(--motion)); --tema:calc(240ms*var(--motion));
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(0,0,.2,1);
  --sb-w:10px;
  color-scheme:dark;
}
[data-theme="claro"]{
  --bg:#F5F6FA; --sf:#FFFFFF; --ov:#FFFFFF; --bd:#E4E7F0;
  --tx:#171A26; --mu:#5B6274; --scrim:rgba(23,26,38,.4);
  --ok:#16A34A; --wa:#D97706; --da:#DC2626; --in:#2563EB;
  --d1:#2563EB; --d2:#7C3AED; --d3:#16A34A; --d4:#D97706;
  --d5:#0891B2; --d6:#DC2626; --d7:#DB2777; --d8:#65A30D;
  --elev:0 1px 3px rgba(23,26,38,.08); --shadow-a:none; --shadow-b:none;
  --shadow-card:0 1px 2px rgba(23,26,38,.05),0 10px 30px rgba(23,26,38,.08);
  color-scheme:light;
}
[data-theme="sepia"]{
  --bg:#EFE6D3; --sf:#F8F1E0; --ov:#FBF6EA; --bd:#D9CBB0;
  --tx:#3B2F23; --mu:#7A6A55; --scrim:rgba(59,47,35,.45);
  --ok:#6B6B33; --wa:#C9A227; --da:#A63D2A; --in:#B4652F;
  --d1:#B4652F; --d2:#8A5A44; --d3:#6B6B33; --d4:#C9A227;
  --d5:#7A6A55; --d6:#A63D2A; --d7:#9C4F63; --d8:#7A8450;
  --elev:0 1px 3px rgba(59,47,35,.14); --shadow-a:none; --shadow-b:none;
  --shadow-card:0 1px 2px rgba(59,47,35,.10),0 10px 30px rgba(59,47,35,.14);
  color-scheme:light;
}
[data-theme="neumorph"]{
  --bg:#E3E6ED; --sf:#E3E6ED; --ov:#EAEDF3; --bd:transparent;
  --tx:#3A3F4A; --mu:#7C8296; --scrim:rgba(58,63,74,.35);
  --ok:#5FA96B; --wa:#D99A2B; --da:#C25549; --in:#6B7FA3;
  --d1:#6B7FA3; --d2:#8A7BA8; --d3:#5FA96B; --d4:#D99A2B;
  --d5:#5F9EA0; --d6:#C25549; --d7:#B06A8A; --d8:#8A9A5B;
  --elev:none; --border-w:0px;
  --shadow-a:-6px -6px 14px #FFFFFF, 6px 6px 14px #B8BDCC;
  --shadow-b:inset 4px 4px 8px #B8BDCC, inset -4px -4px 8px #FFFFFF;
  --shadow-card:var(--shadow-a);
  --r:20px; color-scheme:light;
}
[data-contrast="1"]{ --mu:var(--tx); --bd:var(--mu); }

/* ═══════════════ BASE ═══════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(14px*var(--font))}
body{
  background:var(--bg); color:var(--tx);
  font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  height:100vh; overflow:hidden;
  transition:background var(--tema) var(--ease), color var(--tema) var(--ease);
}
body::before{ /* aurora / grain layer */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:
    radial-gradient(60% 40% at 12% 0%, color-mix(in srgb,var(--d1) 14%,transparent), transparent 60%),
    radial-gradient(50% 36% at 88% 8%, color-mix(in srgb,var(--d7) 12%,transparent), transparent 60%),
    radial-gradient(46% 40% at 50% 100%, color-mix(in srgb,var(--ac) 10%,transparent), transparent 60%);
}
[data-theme="neumorph"] body::before{opacity:.15}
::selection{background:color-mix(in srgb,var(--ac) 40%,transparent)}
button,input,select,textarea{font:inherit;color:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
button{cursor:pointer;background:none;border:none}
a{color:var(--in);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}

/* scrollbars no idioma visual do produto */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ac) 55%,var(--bd)) transparent}
*::-webkit-scrollbar{width:var(--sb-w);height:var(--sb-w)}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{
  background:color-mix(in srgb,var(--ac) 45%,var(--bd));
  border-radius:99px;border:2px solid var(--bg);
}
*::-webkit-scrollbar-thumb:hover{background:var(--ac)}

/* ═══════════════ LAYOUT ═══════════════ */
header{
  position:relative;z-index:26;height:56px;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:color-mix(in srgb,var(--sf) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:var(--border-w) solid var(--bd);
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo svg{width:24px;height:24px;color:var(--ac)}
.searchbtn{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--ov);border:var(--border-w) solid var(--bd);border-radius:99px;
  padding:7px 14px;color:var(--mu);box-shadow:var(--shadow-b);
  transition:border-color var(--micro) var(--ease);
}
.searchbtn:hover{border-color:var(--ac)}
.searchbtn kbd{margin-left:auto;font:600 .72rem ui-monospace,monospace;background:var(--bg);
  border:var(--border-w) solid var(--bd);border-radius:6px;padding:2px 6px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-dots{display:flex;gap:6px}
.theme-dots button{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);transition:transform var(--micro)}
.theme-dots button:hover{transform:scale(1.2)}
.theme-dots button.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.gov-pill{display:flex;align-items:center;gap:8px;font:600 .78rem ui-monospace,monospace;
  background:var(--ov);border:var(--border-w) solid var(--bd);border-radius:99px;padding:5px 12px;box-shadow:var(--shadow-b)}
.gov-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.gov-pill.warn .dot{background:var(--wa);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:8px 14px;
  font-weight:600;font-size:.86rem;border:var(--border-w) solid var(--bd);
  background:var(--ov);box-shadow:var(--shadow-a);
  transition:transform var(--micro) var(--ease),box-shadow var(--micro),background var(--micro);
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-card)}
.btn:active{transform:translateY(0);box-shadow:var(--shadow-b)}
.btn.primary{background:var(--ac);color:#10131a;border-color:transparent;
  box-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--ac) 55%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--da) 16%,var(--ov));color:var(--da);border-color:color-mix(in srgb,var(--da) 40%,transparent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 10px;font-size:.78rem;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

.app{position:relative;z-index:1;display:grid;height:calc(100vh - 56px);
  grid-template-columns:1fr;grid-template-areas:"main";padding-left:74px}
/* nav = trilho escuro SEMPRE visível (menu fechado mostra só ícones) + painel
   que expande a partir do próprio trilho (sem barra nova) ao clicar */
nav{position:fixed;top:66px;left:10px;bottom:10px;z-index:25;display:flex;gap:8px;align-items:stretch;
  width:62px;overflow:hidden}
nav.open{width:auto;overflow:visible}
nav .rail{width:54px;flex:none;padding:10px 0;display:flex;flex-direction:column;
  align-items:center;gap:4px;background:#13151c;border-radius:16px;
  box-shadow:0 12px 34px rgba(0,0,0,.42)}
nav .rail .r-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px;
  color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
nav .rail .r-logo svg{width:18px;height:18px}
nav .rail button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#8b90a2;
  transition:color var(--micro),background var(--micro),transform var(--micro) var(--ease)}
nav .rail button:hover{color:#fff;background:rgba(255,255,255,.09);transform:translateY(-1px)}
nav .rail button.on{color:#fff;background:color-mix(in srgb,var(--ac) 30%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent),0 0 16px color-mix(in srgb,var(--ac) 32%,transparent)}
nav .rail button svg{width:18px;height:18px}
nav .npanel{width:min(232px,62vw);padding:12px;display:flex;flex-direction:column;
  gap:2px;overflow-y:auto;background:color-mix(in srgb,var(--sf) 96%,transparent);
  border:var(--border-w) solid var(--bd);border-radius:18px;backdrop-filter:blur(12px);
  box-shadow:var(--shadow-card),18px 0 44px rgba(0,0,0,.28);
  transform:translateX(calc(-100% - 62px));pointer-events:none;
  transition:transform calc(300ms*var(--motion)) cubic-bezier(.3,.9,.32,1.06)}
nav.open .npanel{transform:none;pointer-events:auto}
nav .nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:var(--mu);font-weight:600;font-size:.88rem;margin-bottom:2px;text-align:left;
  border-left:3px solid transparent;transition:all var(--micro) var(--ease);
}
nav .nav-item svg{width:17px;height:17px;flex:none}
nav .nav-item:hover{color:var(--tx);background:var(--ov)}
nav .nav-item.on{color:var(--tx);background:color-mix(in srgb,var(--ac) 12%,var(--ov));border-left-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
nav .nav-item .nl{flex:1}
nav .nav-item .cnt{font:600 .7rem ui-monospace,monospace;color:var(--mu)}
nav .nav-item .badge{font:700 .68rem ui-monospace,monospace;background:var(--da);color:#fff;border-radius:99px;padding:1px 7px}
nav .nav-sec{font:700 .66rem/1 ui-monospace,monospace;letter-spacing:.12em;color:var(--mu);
  text-transform:uppercase;margin:14px 12px 6px}
main{grid-area:main;overflow-y:auto;padding:calc(16px*var(--density));scroll-behavior:smooth}
/* estúdio = painel fixo no canto superior direito (oposto ao hambúrguer), fechado por padrão */
.studio{position:fixed;top:56px;right:0;bottom:0;width:min(336px,94vw);z-index:24;overflow-y:auto;
  padding:14px;border-left:var(--border-w) solid var(--bd);
  background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(12px);
  box-shadow:var(--shadow-card),-14px 0 44px rgba(0,0,0,.26);
  transform:translateX(106%);transition:transform calc(300ms*var(--motion)) cubic-bezier(.3,.9,.32,1.06)}
body.studio-open .studio{transform:none}

/* ═══════════════ COMPONENTES ═══════════════ */
.card{background:var(--sf);border:var(--border-w) solid var(--bd);border-radius:var(--r);
  box-shadow:var(--shadow-card);padding:calc(14px*var(--density));
  transition:box-shadow var(--base) var(--ease),transform var(--base) var(--ease),border-color var(--base) var(--ease)}
.card.hoverable:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 38%,var(--bd));
  box-shadow:var(--shadow-card),0 0 calc(24px*var(--glow)) color-mix(in srgb,var(--ac) 20%,transparent)}
.card h3{font-size:.92rem;font-weight:700;letter-spacing:.01em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sub{margin-left:auto;font:500 .72rem ui-monospace,monospace;color:var(--mu)}
.grid{display:grid;gap:calc(12px*var(--density))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .num{font:800 1.9rem/1.1 ui-monospace,monospace;letter-spacing:-.02em}
.kpi .lbl{color:var(--mu);font-size:.78rem;font-weight:600;margin-top:4px}
.kpi .spark{position:absolute;right:8px;bottom:8px;opacity:.8}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--kc,var(--ac))}
.cols-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-size:1.35rem;letter-spacing:-.02em}
.page-head .crumb{color:var(--mu);font-size:.78rem;font-weight:600}
.page-head .spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:var(--border-w) solid var(--bd);background:var(--ov);border-radius:99px;
  padding:4px 12px;font-size:.76rem;font-weight:700;color:var(--mu);box-shadow:var(--shadow-b);
  transition:all var(--micro)}
.chip.on{color:var(--tx);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--ov))}
.chip .n{opacity:.7;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{font:700 .68rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;
  color:var(--mu);text-align:left;padding:8px 10px;border-bottom:var(--border-w) solid var(--bd);cursor:pointer;user-select:none}
th:hover{color:var(--tx)}
td{padding:9px 10px;border-bottom:var(--border-w) solid color-mix(in srgb,var(--bd) 55%,transparent);vertical-align:middle}
tbody tr{transition:background var(--micro)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--ac) 6%,transparent)}
tbody tr.sel{background:color-mix(in srgb,var(--ac) 12%,transparent)}
tbody tr[draggable]{cursor:grab}
tbody tr.dragging{opacity:.4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sev{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font:700 .7rem ui-monospace,monospace}
.sev::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sev.critical{background:color-mix(in srgb,var(--da) 18%,transparent);color:var(--da)}
.sev.high{background:color-mix(in srgb,#F97316 18%,transparent);color:#F97316}
.sev.medium{background:color-mix(in srgb,var(--wa) 18%,transparent);color:var(--wa)}
.sev.low{background:color-mix(in srgb,var(--mu) 18%,transparent);color:var(--mu)}
.mode{font:700 .68rem ui-monospace,monospace;border-radius:6px;padding:2px 8px;border:var(--border-w) solid var(--bd)}
.mode.managed{color:var(--d3);border-color:color-mix(in srgb,var(--d3) 45%,transparent)}
.mode.mirror{color:var(--d5);border-color:color-mix(in srgb,var(--d5) 45%,transparent)}
.mode.dormant{color:var(--mu)}
.dotstat{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.feed{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto}
.feed .ev{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:8px;font-size:.82rem;
  animation:ev-in var(--base) var(--ease-out)}
.feed .ev:hover{background:var(--ov)}
.feed .ev .t{font:500 .7rem ui-monospace,monospace;color:var(--mu);flex:none}
.feed .ev .k{font-weight:700}
@keyframes ev-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.jobrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;font-size:.82rem}
.jobrow:hover{background:var(--ov)}
.jobrow .bar{flex:1;height:5px;border-radius:99px;background:var(--ov);overflow:hidden}
.jobrow .bar i{display:block;height:100%;background:var(--jc,var(--ac));border-radius:99px;
  transition:width 1s linear;box-shadow:0 0 calc(10px*var(--glow)) var(--jc,var(--ac))}
.jobrow .pct{font:600 .72rem ui-monospace,monospace;color:var(--mu);width:38px;text-align:right}
.toggle{position:relative;width:40px;height:22px;border-radius:99px;background:var(--ov);
  border:var(--border-w) solid var(--bd);box-shadow:var(--shadow-b);transition:background var(--micro);flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--mu);transition:transform var(--micro) var(--ease),background var(--micro)}
.toggle.on{background:color-mix(in srgb,var(--ac) 30%,var(--ov))}
.toggle.on::after{transform:translateX(18px);background:var(--ac)}
input[type=text],input[type=search],input[type=number],select,textarea{
  background:var(--ov);border:var(--border-w) solid var(--bd);border-radius:9px;
  padding:7px 11px;font-size:.84rem;box-shadow:var(--shadow-b);width:100%;
  transition:border-color var(--micro)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--ac) var(--fill,50%),var(--ov) var(--fill,50%));box-shadow:var(--shadow-b)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--ac);border:2px solid var(--sf);box-shadow:0 0 calc(10px*var(--glow)) color-mix(in srgb,var(--ac) 60%,transparent);cursor:grab}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ac);border:2px solid var(--sf);cursor:grab}
input[type=color]{width:34px;height:26px;border:var(--border-w) solid var(--bd);border-radius:7px;background:var(--ov);padding:2px;cursor:pointer}
.field{margin-bottom:12px}
.field label{display:flex;justify-content:space-between;font:600 .74rem ui-monospace,monospace;color:var(--mu);margin-bottom:6px}
.field label output{color:var(--tx)}
.studio h2{font-size:.95rem;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.studio .hint{color:var(--mu);font-size:.74rem;margin-bottom:14px}
.studio .grp{border-top:var(--border-w) solid var(--bd);padding-top:12px;margin-top:12px}
.studio .grp:first-of-type{border-top:none;margin-top:0;padding-top:0}
.studio .grp-t{font:700 .66rem ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.studio .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-card{border:var(--border-w) solid var(--bd);border-radius:10px;padding:8px;font-size:.74rem;font-weight:700;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-a);transition:all var(--micro)}
.theme-card .sw{height:26px;border-radius:6px;border:1px solid rgba(128,128,128,.25)}
.theme-card.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 35%,transparent)}
.canvas-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sf);

const FONT_STACKS={
 display:"'Orbitron','Audiowide','Oxanium','Bruno Ace SC',ui-sans-serif,system-ui",
 body:"'Oxanium',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",
 mono:"'Share Tech Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
};
const FONTS_BY_KIND={system:null,display:FONT_STACKS.display,mono:FONT_STACKS.mono,serif:"Georgia,'Times New Roman',serif"};
function applyThemeVars(){
  const d=THEME_DEFS[state.theme]||THEME_DEFS.escuro, r=document.documentElement.style;
  const set=(k,v)=>r.setProperty(k,v);
  set("--bg",d.bg);set("--sf",d.sf);set("--ov",d.ov);set("--bd",d.bd);set("--tx",d.tx);set("--mu",d.mu);
  set("--scrim",d.scheme==="light"?"rgba(23,26,38,.42)":"rgba(4,6,12,.72)");
  set("--ok",d.ok);set("--wa",d.wa);set("--da",d.da);set("--in",d.in);
  ["d1","d2","d3","d4","d5","d6","d7","d8"].forEach(k=>set("--"+k,d[k]));
  set("--elev",d.scheme==="light"?"0 1px 3px rgba(23,26,38,.1)":"0 1px 3px rgba(0,0,0,.4)");
  set("--shadow-a",d.sa||"none");set("--shadow-b",d.sb||"none");
  set("--border-w",(d.bw==null?1:d.bw)+"px");set("--r",(d.r||14)+"px");
  const fd=d.fd||FONTS_BY_KIND[d.font]||null;
  set("--font-display",fd||"inherit");
  set("--font-body",d.font==="display"||d.font==="mono"?FONT_STACKS.body:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif");
  set("--font-mono",d.font==="mono"?FONT_STACKS.mono:(d.cyber?FONT_STACKS.mono:"ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"));
  document.documentElement.style.colorScheme=d.scheme;
  document.documentElement.dataset.cyber=d.cyber?"1":"0";
  if(state.contrast){set("--mu",d.tx);set("--bd",d.mu)}
}
const THEMES=[["escuro","#0B0E14"],["claro","#F5F6FA"],["sepia","#EFE6D3"],["neumorph","#E3E6ED"]];
function applyPrefs(){
  const r=document.documentElement;
  r.dataset.theme=state.theme; r.dataset.contrast=state.contrast?"1":"0";
  applyThemeVars();
  r.style.setProperty("--ac",state.accent);
  r.style.setProperty("--density",state.density);
  r.style.setProperty("--motion",state.motion);
  r.style.setProperty("--glow",state.glow);
  r.style.setProperty("--font",state.font);
  $$("#themeDots button").forEach(b=>b.classList.toggle("on",b.dataset.theme===state.theme));
  $$("#studio [data-pref]").forEach(el=>{
    const k=el.dataset.pref;
    if(el.type==="checkbox") el.checked=!!state[k];
    else if(el.type==="range"||el.type==="color"||el.tagName==="SELECT") el.value=state[k];
    if(el.type==="range"){const min=+el.min,max=+el.max;el.style.setProperty("--fill",((state[k]-min)/(max-min)*100)+"%")}
    const out=el.closest(".field")?.querySelector("output"); if(out) out.textContent=fmtPref(k,state[k]);
  });
  $$("#studio .theme-card").forEach(c=>c.classList.toggle("on",c.dataset.theme===state.theme));
  persist();
}
function fmtPref(k,v){
  if(typeof v==="boolean")return v?"on":"off";
  if(k==="density"||k==="font")return (+v).toFixed(2)+"×";
  if(k==="motion")return (+v).toFixed(1)+"×";
  if(k==="glow")return Math.round(v*100)+"%";
  if(k==="nodes"||k==="depth")return v;
  return v;
}

function renderNav(){

    const cnt=id==="repos"?state.repos.length:0;
    return `<button class="nav-item ${state.screen===id?"on":""}" data-act="nav" data-screen="${id}" ${state.screen===id?'aria-current="page"':""}>
      ${icon(ic)}<span class="nl">${label}</span>${cnt?`<span class="cnt">${cnt}</span>`:""}${badge?`<span class="badge">${badge}</span>`:""}</button>`;
  };
  const railBtn=([id,label,ic])=>`<button class="${state.screen===id?"on":""}" data-act="nav" data-screen="${id}" aria-label="${label}" title="${label}">${icon(ic)}</button>`;
  $("#nav").innerHTML=`

function cronNext(cron){
  const m=cron.match(/^(\S+)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)$/); if(!m)return "cron inválido";
  const min=m[1],hr=m[2];
  if(min.startsWith("*/"))return "a cada "+min.slice(2)+" min";
  if(hr.startsWith("*/"))return "a cada "+hr.slice(2)+" h";
  if(hr!=="*")return "diário às "+hr.padStart(2,"0")+":"+ (min==="*"?"00":min.padStart(2,"0"));
  return "próximo ciclo";
}

function mergeResult(c){
  const d=state.driver;
  if(d==="ours")return c.ours;
  if(d==="theirs")return c.theirs;
  if(d==="union"){const set=[...new Set([...c.ours,...c.theirs])];return set}
  if(d==="structured"){ // 3-way por linha: base como âncora
    const out=[];const max=Math.max(c.ours.length,c.theirs.length,c.base.length);
    for(let i=0;i<max;i++){const o=c.ours[i],t=c.theirs[i],b=c.base[i];
      if(o===t){if(o!==undefined)out.push(o)}
      else if(o===b){if(t!==undefined)out.push(t)}
      else if(t===b){if(o!==undefined)out.push(o)}
      else out.push(o!==undefined?o:t)}
    return out;
  }
  return null; // escalate
}

function buildBranchGraph(i){
  const repo=BRANCH_REPOS[i]||BRANCH_REPOS[0];
  const B=(x,lane,letter,branch,msg,who,tags)=>({x,lane,l:letter,branch,msg,who,tags:tags||[],
    sha:hash(repo.name+letter).slice(0,7),color:BRANCH_LANES[branch].color});
  const commits=[
    B(0,0,"A","main","chore: bootstrap do repo","ana"),
    B(1,0,"B","main","feat: pipeline base","bruno"),
    B(2,0,"C","main","feat: sync engine v2","ana"),
    B(3,-1,"D","feature/new-ui","feat: nova UI shell","carol"),
    B(4,-1,"E","feature/new-ui","feat: tema dinâmico","carol"),
    B(6,-1,"F","feature/new-ui","fix: overflow do drawer","carol"),
    B(5,1,"G","feature/bugfix","fix: race no slice","davi"),
    B(6,1,"G1","feature/bugfix","fix: retry do CAS","davi"),
    B(4,-2,"R1","release/x","release: changelog + notas","ana"),
    B(7,0,"H","main","merge: feature/new-ui → main","ci-bot"),
    B(8,0,"I","main","chore: tag final","ci-bot",["Release v"+repo.rel])
  ];
  if(repo.hotfix){
    commits.push(B(3,2,"P","hotfix/auth","hotfix: token ttl 900","ops"));
    commits.push(B(5,2,"Q","hotfix/auth","hotfix: audit de login","ops"));
  }
  const idx={};commits.forEach((c,i)=>idx[c.l]=i);
  const edges=[["B","A",0],["C","B",0],["D","C",0],["E","D",0],["F","E",0],
    ["G","C",0],["G1","G",0],["H","F",1],["H","G1",1],["I","H",0],["R1","B",0],["I","R1",1]];
  if(repo.hotfix){edges.push(["P","C",0],["Q","P",0],["H","Q",1])}
  return {repo,commits,edges:edges.map(([a,b,m])=>[idx[a],idx[b],m])};
}

let branchAnimStart=0;
function drawBranches(cv,t){
  if(!cv)return;
  const dpr=Math.min(devicePixelRatio||1,2),W=920,H=340;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    cv.getContext("2d").setTransform(dpr,0,0,dpr,0,0);branchAnimStart=performance.now()}
  const ctx=cv.getContext("2d");ctx.clearRect(0,0,W,H);
  const g=buildBranchGraph(state.branchRepo);
  const cy=H/2+8,X=x=>66+x*88,Y=l=>cy+l*54;
  const p=state.motion===0?1:clamp((t-branchAnimStart)/(900*state.motion),0,1);
  const reach=p*(W-90)+66;
  // trilhos das lanes
  Object.values(BRANCH_LANES).forEach(L=>{
    ctx.strokeStyle=cssVar("--bd");ctx.globalAlpha=.4;ctx.setLineDash([3,6]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(30,Y(L.lane));ctx.lineTo(W-16,Y(L.lane));ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle=cssVar(L.color);ctx.font="700 10px ui-monospace,monospace";ctx.textAlign="left";
    ctx.globalAlpha=.85;ctx.fillText(Object.keys(BRANCH_LANES).find(k=>BRANCH_LANES[k]===L),30,Y(L.lane)-7);ctx.globalAlpha=1;
  });
  // arestas
  g.edges.forEach(([a,b,merge])=>{
    const A=g.commits[a],B2=g.commits[b];
    if(X(B2.x)>reach)return;
    const x1=X(A.x),y1=Y(A.lane),x2=X(B2.x),y2=Y(B2.lane);
    ctx.strokeStyle=cssVar(A.color);ctx.globalAlpha=merge?.85:.5;ctx.lineWidth=merge?2.2:1.6;
    ctx.beginPath();
    if(!merge&&A.lane===B2.lane){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)}
    else{ctx.moveTo(x1,y1);ctx.bezierCurveTo(x1,(y1+y2)/2,x2,(y1+y2)/2,x2,y2)}
    ctx.stroke();ctx.globalAlpha=1;
    if(merge){ctx.fillStyle=cssVar(A.color);ctx.beginPath();ctx.arc(x2,y2,3.2,0,7);ctx.fill()}
  });
  // nós
  g.commits.forEach((c,i)=>{
    if(X(c.x)>reach)return;
    const x=X(c.x),y=Y(c.lane);
    ctx.fillStyle=cssVar("--sf");ctx.strokeStyle=cssVar(c.color);ctx.lineWidth=2;
    if(state.glow>0){ctx.shadowColor=cssVar(c.color);ctx.shadowBlur=8*state.glow}
    ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=c.branch==="main"?cssVar("--tx"):cssVar(c.color);
    ctx.font="800 10px ui-monospace,monospace";ctx.textAlign="center";
    ctx.fillText(c.l,x,y+3.5);
    ctx.fillStyle=cssVar("--mu");ctx.font="500 9px ui-monospace,monospace";
    ctx.fillText(c.who,x,y+24);
    ctx.textAlign="left";
    if(state.branchHover===i){ctx.strokeStyle=cssVar("--ac");ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.stroke()}
    c.tags.forEach((tg,k)=>{
      ctx.font="700 9px ui-monospace,monospace";const tw=ctx.measureText(tg).width+14;
      if(state.glow>0){ctx.shadowColor=cssVar("--ac");ctx.shadowBlur=10*state.glow}
      ctx.fillStyle=cssVar("--ac");
      ctx.beginPath();ctx.roundRect(x-tw/2,y-32-k*17,tw,14,7);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#10131a";ctx.textAlign="center";ctx.fillText(tg,x,y-21-k*17);ctx.textAlign="left"});
  });
}

const CLUSTERS=8, MAXN=800;

    const w2=Math.max(70,label.length*7+18);
    ctx.beginPath();ctx.roundRect(x-w2/2,y-13,w2,26,13);ctx.fill();ctx.stroke();
    ctx.fillStyle=cssVar(hub?"#10131a":"--tx");ctx.textAlign="center";ctx.fillText(label,x,y+4);ctx.textAlign="left";
  }
}
function drawDonut(cv){
  if(!cv)return;const ctx=cv.getContext("2d");
  const w=cv.width/Math.min(devicePixelRatio||1,2),h=cv.height/Math.min(devicePixelRatio||1,2);
  ctx.clearRect(0,0,w,h);
  const data=[["npm",42,"--d1"],["PyPI",26,"--d3"],["crates",18,"--d4"],["Go",9,"--d5"],["skill",5,"--d7"]];
  const total=data.reduce((a,d)=>a+d[1],0);
  const cx=w*0.36,cy=h/2,R=Math.min(w,h)*0.38,r=R*0.62;
  let a=-Math.PI/2;
  data.forEach(([l,v,c])=>{const a2=a+v/total*Math.PI*2;
    ctx.strokeStyle=cssVar(c);ctx.lineWidth=R-r;ctx.beginPath();ctx.arc(cx,cy,(R+r)/2,a+0.02,a2-0.02);ctx.stroke();a=a2});
  ctx.fillStyle=cssVar("--tx");ctx.font="800 18px ui-monospace,monospace";ctx.textAlign="center";
  ctx.fillText("1.284",cx,cy);ctx.font="500 10px ui-monospace,monospace";ctx.fillStyle=cssVar("--mu");
  ctx.fillText("pacotes",cx,cy+14);ctx.textAlign="left";
  let ly=cy-data.length*9;
  data.forEach(([l,v,c])=>{ctx.fillStyle=cssVar(c);ctx.fillRect(w*0.68,ly-6,8,8);
    ctx.fillStyle=cssVar("--tx");ctx.font="600 11px system-ui";ctx.fillText(l+" "+v,w*0.68+14,ly+2);ly+=18});
}

/* ═══════════════════════ GITFLOW (estilo GitKraken, dados reais) ═══════════════════════ */
const GF_CACHE={};
const GF_ROW=26,GF_PAD=8,GF_X=24;
const GF_PAL=["#a371f7","#79c0ff","#56d4dd","#ffa657","#ff9bce","#7ee787","#e3b341","#d2a8ff"];
function gfColor(refs,lane){
  const s=(refs||"").toLowerCase();
  const named=[["main","#3fb950"],["master","#3fb950"],["trunk","#3fb950"],["develop","#39c5cf"],
    ["feature","#a371f7"],["bugfix","#d29922"],["hotfix","#f85149"],["release","#58a6ff"]];
  for(const [k,c] of named) if(s.includes(k)) return c;
  return GF_PAL[(lane||0)%GF_PAL.length];
}
/* atribui lanes: o commit ocupa a lane que o esperava; o 1º pai continua na
   mesma lane, os demais pais (merge) abrem/reusam outra lane */
function gfLayout(commits){
  const laneNext=[];
  const rows=commits.map(c=>{
    let lane=laneNext.indexOf(c.sha);
    if(lane===-1){lane=laneNext.indexOf(null);
      if(lane===-1){lane=laneNext.length;laneNext.push(null)}}
    laneNext[lane]=null;
    const edges=[];
    c.parents.forEach((p,i)=>{
      if(i===0)laneNext[lane]=p;
      else{let l2=laneNext.indexOf(p);
        if(l2===-1){l2=laneNext.indexOf(null);
          if(l2===-1){l2=laneNext.length;laneNext.push(null)}
          laneNext[l2]=p}
        edges.push({to:l2,sha:p})}
    });
    return {...c,lane,edges};
  });
  return {rows,lanes:Math.max(1,laneNext.length)};
}
function drawGitflow(rows,lanes){
  const cv=$("#gfCanvas");if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=150,H=GF_PAD*2+rows.length*GF_ROW;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const X=l=>GF_PAD+l*GF_X, Y=i=>GF_PAD+12+i*GF_ROW;
  const rowOf={};rows.forEach((c,i)=>rowOf[c.sha]=i);
  const span={};
  const touch=(l,i)=>{if(!(l in span))span[l]=[i,i];else{span[l][0]=Math.min(span[l][0],i);span[l][1]=i}};
  rows.forEach((c,i)=>{touch(c.lane,i);c.edges.forEach(e=>touch(e.to,i))});
  ctx.lineWidth=2;
  for(const l in span){const[a,b]=span[l];ctx.strokeStyle="rgba(128,140,160,.28)";
    ctx.beginPath();ctx.moveTo(X(l),Y(a));ctx.lineTo(X(l),Y(b));ctx.stroke()}
  rows.forEach((c,i)=>{c.edges.forEach(e=>{
    const j=rowOf[e.sha];if(j==null)return;
    ctx.strokeStyle=gfColor(c.refs,c.lane);ctx.beginPath();ctx.moveTo(X(c.lane),Y(i));
    ctx.bezierCurveTo(X(e.to),Y(i),X(e.to),Y(j)-14,X(e.to),Y(j)-6);ctx.stroke()})});
  rows.forEach((c,i)=>{const col=gfColor(c.refs,c.lane);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(c.lane),Y(i),5,0,7);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1.4;ctx.stroke();
    if(i===0){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(c.lane),Y(i),8.5,0,7);ctx.stroke()}});
}
function renderGitflow(r,data){
  const {rows,lanes}=gfLayout(data.commits);
  $("#gfWrap").innerHTML=`<div class="gf">
    <canvas id="gfCanvas"></canvas>
    <div class="gf-list">${rows.map(c=>{
      const tags=(c.refs.match(/[^,()>\s][^,)]*/g)||[]).filter(t=>!/^HEAD/.test(t)).slice(0,3);
      return `<div class="gf-row"><span class="sha">${c.sha.slice(0,7)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(c.subject)}</span>
        ${tags.map(t=>`<span class="gf-tag" style="background:${gfColor(t,c.lane)}">${esc(t.trim())}</span>`).join("")}
        <span class="who">${esc(c.author)} · ${ago(c.ts)}</span></div>`}).join("")}
    </div></div>
    <div class="hint" style="margin-top:8px">${rows.length} commits · ${lanes} lane${lanes>1?"s":""} · gitflow: main → feature/bugfix → merge via PR</div>`;
  drawGitflow(rows,lanes);
}
async function loadGitflow(r){
  if(GF_CACHE[r.name]){renderGitflow(r,GF_CACHE[r.name]);return}
  const w=$("#gfWrap");if(w)w.innerHTML=`<div class="hint">Carregando histórico de ${esc(r.name)}…</div>`;
  try{
    const res=await fetch("/api/log?path="+encodeURIComponent(r.name)+"&n=120",{cache:"no-store"});
    if(!res.ok)throw new Error("http");
    const data=await res.json();
    if(!data.ok||!data.commits.length)throw new Error("vazio");
    GF_CACHE[r.name]=data;
    if(state.drawerRepo===r.id&&state.repoTab==="gitflow")renderGitflow(r,data);
  }catch(e){
    const w2=$("#gfWrap");
    if(w2&&state.drawerRepo===r.id)w2.innerHTML=`<div class="hint">API indisponível — rode <span class="mono">npm run dev</span> para o grafo gitflow real.</div>`;
  }
}

    case "palette-themes": openPalette();$("#palInput").value="tema";renderPalette("tema");break;
    case "open-pr-repo": {const r=state.repos.find(x=>x.id===id);closeDrawer();openModal(`<h2>Abrir PR · ${esc(r.name)}</h2>
      <div class="field"><label>Título</label><input type="text" id="prTitle" value="sync: ${esc(r.branch)} → main"></div>
      <div class="mrow"><button class="btn ghost" data-act="close-modal">Cancelar</button>
      <button class="btn primary" id="prOk">Criar PR</button></div>`);
      $("#prOk").onclick=()=>{const p={id:Math.max(0,...state.prs.map(x=>x.id))+1,title:$("#prTitle").value,

        state.screen="prs";render();toast("PR #"+p.id+" aberto para "+r.name)};break}
    case "repo-doc": {const p=t.dataset.path;const di=state.docs.findIndex(d=>d.path===p);
      if(di>=0){state.docSel=di;state.docSearch="";closeDrawer();state.screen="docs";render()}break}
    case "palette": openPalette();break;
    case "theme": state.theme=t.dataset.theme;applyPrefs();
      {const sw=$("#sweep");if(sw){sw.classList.remove("go");void sw.offsetWidth;sw.classList.add("go")}}
      {const g=$("#themeGallery");if(g)g.innerHTML=renderThemeGallery()}
      break;
    case "add-repo": addRepoModal();break;
    case "add-policy": addPolicyModal();break;
    case "add-pr": addPRModal();break;
    case "close-modal": closeModal();break;
    case "close-drawer": closeDrawer();closeNav();closeStudio();break;
    case "undo": doUndo();break;
    case "doctor": doctor();break;
    case "fs-toggle": {const rel=t.dataset.rel;
      if(state.fs.open.has(rel)){state.fs.open.delete(rel);render()}
      else{state.fs.open.add(rel);render();fsLoad(rel)}break}
    case "fs-open": {const rel=t.dataset.rel;state.fs.sel=rel;state.fs.detail={loading:true};
      render();fsRepo(rel).then(d=>{if(state.fs.sel===rel){state.fs.detail=d;render()}});break}
    case "fs-refresh": {state.fs.kids={};state.fs.open=new Set();state.fs.busy={};
      state.fs.sel=null;state.fs.detail=null;state.fs.err=null;render();fsEnsure();break}
    case "fs-import": {if(fsAddRepo(state.fs.detail))persist();render();break}
    case "fs-import-visible": fsImportVisible();break;
    case "randomize": randomize();break;
    case "reset": reset();break;
    case "export-state": exportState();break;
    case "export-svg": exportSVG();break;
    case "export-sarif": exportSARIF();break;
    case "osv-sync": toast("OSV sync iniciado · delta por ecossistema.");state.events.unshift({t:now(),k:"osv.sync",m:"PyPI · npm · crates.io",c:"var(--d6)"});break;
    case "repo-mode": state.repoMode=t.dataset.mode;render();break;
    case "sort": {const k=t.dataset.k;if(state.repoSort===k)state.repoDir*=-1;else{state.repoSort=k;state.repoDir=1}render();break}
    case "save-view": {const name=prompt("Nome da view:",state.repoMode+" · "+state.repoSort);if(name){state.savedViews.push({name,search:state.repoSearch,mode:state.repoMode,sort:state.repoSort,dir:state.repoDir});persist();render();toast("View salva: "+name)}break}
    case "apply-view": {const v=state.savedViews[i];Object.assign(state,{repoSearch:v.search,repoMode:v.mode,repoSort:v.sort,repoDir:v.dir});render();break}
    case "del-view": {const v=state.savedViews.splice(i,1)[0];persist();render();toast("View removida.",()=>{state.savedViews.splice(i,0,v);persist()});break}
    case "open-repo": state.drawerRepo=id;state.repoTab="resumo";openRepoDrawer();break;
    case "repo-tab": state.repoTab=t.dataset.tab;openRepoDrawer();break;
    case "edit-repo": {const r=state.repos.find(x=>x.id===id);
      openModal(`<h2>Editar ${esc(r.name)}</h2>
        <div class="field"><label>Nome</label><input type="text" id="erName" value="${esc(r.name)}"></div>
        <div class="field"><label>Branch</label><input type="text" id="erBranch" value="${esc(r.branch)}"></div>
        <div class="mrow"><button class="btn ghost" data-act="close-modal">Cancelar</button>
        <button class="btn primary" id="erOk">Salvar</button></div>`);
      $("#erOk").onclick=()=>{const old={...r};r.name=$("#erName").value;r.branch=$("#erBranch").value;
        closeModal();persist();render();toast("Repositório atualizado.",()=>{Object.assign(r,old);persist()})};break}
    case "fetch-repo": {const r=state.repos.find(x=>x.id===id);if(r){r.last=now();r.sha=hash(r.name+now());
      state.events.unshift({t:now(),k:"sync.ok",m:r.name+" · "+r.sha.slice(0,7),c:"var(--d5)"});
      persist();toast("Fetch concluído: "+r.name);if(state.screen==="repos"||state.screen==="overview")render()}break}
    case "slice-repo": closeDrawer();state.screen="slice";render();break;
    case "del-repo": {const idx=state.repos.findIndex(x=>x.id===id);const r=state.repos.splice(idx,1)[0];
      closeDrawer();persist();render();toast("Excluído: "+r.name,()=>{state.repos.splice(idx,0,r);persist()});break}
    case "bulk-delete": {const removed=state.repos.filter(r=>state.selection.has(r.id));
      state.repos=state.repos.filter(r=>!state.selection.has(r.id));const ids=new Set(state.selection);state.selection.clear();
      persist();render();toast(removed.length+" repositórios excluídos.",()=>{state.repos=[...removed,...state.repos];persist()});break}
    case "bulk-archive": {const affected=state.repos.filter(r=>state.selection.has(r.id));const prev=affected.map(r=>[r,r.mode]);
      affected.forEach(r=>r.mode="dormant");state.selection.clear();persist();render();
      toast(affected.length+" arquivados.",()=>{prev.forEach(([r,m])=>r.mode=m);persist()});break}
    case "clear-sel": state.selection.clear();render();break;
    case "toggle-policy": {const p=state.policies.find(x=>x.id===id);p.on=!p.on;persist();
      state.events.unshift({t:now(),k:p.on?"policy.on":"policy.off",m:p.name,c:"var(--d5)"});
      if(state.screen==="sync"||state.screen==="overview")render();else applyPrefs();break}
    case "run-policy": {const p=state.policies.find(x=>x.id===id);
      state.events.unshift({t:now(),k:"sync.run",m:p.name+" → "+p.dst,c:"var(--d5)"});
      state.jobs.unshift({id:Date.now(),kind:"sync",repo:p.dst,p:5,c:"var(--d5)"});
      toast("Sync disparado: "+p.name);render();break}
    case "del-policy": {const idx=state.policies.findIndex(x=>x.id===id);const p=state.policies.splice(idx,1)[0];
      persist();render();toast("Policy removida: "+p.name,()=>{state.policies.splice(idx,0,p);persist()});break}
    case "exec-slice": confirmCAS("Executar plano de slice","9d2f1a",hash("exec"+state.sliceMax),()=>{
        state.sliceExecuted=true;state.events.unshift({t:now(),k:"slice.exec",m:slicePlan().length+" fatias · CAS ✓",c:"var(--d4)"});
        render();toast("Plano executado com CAS + backup.")});break;
    case "sel-conflict": state.conflictSel=i;state.driver=state.conflicts[i].driver;render();break;
    case "replay-merge": toast("Replay bit-idêntico ✓ · recipe "+hash(state.driver));break;
    case "apply-merge": {const c=state.conflicts[state.conflictSel];
      confirmCAS("Aplicar merge · "+c.file,hash(c.base.join("")),hash((mergeResult(c)||[]).join("")),()=>{
        state.conflicts.splice(state.conflictSel,1);state.conflictSel=0;
        state.events.unshift({t:now(),k:"merge.cas",m:c.repo+" · "+c.file,c:"var(--d3)"});
        render();toast("Merge aplicado via CAS.")});break}
    case "sev": state.sevFilter=t.dataset.sev;render();break;
    case "open-finding": {const f=state.findings.find(x=>x.id===t.dataset.id);
      openDrawer(`<div class="dh"><h2 class="mono">${esc(f.id)}</h2><button class="btn sm ghost" data-act="close-drawer">${icon("x",14)}</button></div>
        <span class="sev ${f.sev}">${f.sev}</span>
        <div class="cas" style="margin-top:12px">pacote ${esc(f.pkg)} ${esc(f.ver)}<br>fix <span class="new">${esc(f.fix)}</span><br>repo ${esc(f.repo)} · eco ${esc(f.eco)}</div>
        <p style="font-size:.8rem;color:var(--mu);margin-bottom:12px">Range afetado confirmado pelo matcher OSV. Bump sugerido disponível.</p>
        <button class="btn primary" data-act="bump-pr" data-id="${esc(f.id)}">${icon("prs",13)} Auto-PR de bump</button>`);break}
    case "bump-pr": {const f=state.findings.find(x=>x.id===t.dataset.id);
      state.prs.unshift({id:Math.max(...state.prs.map(p=>p.id))+1,title:"bump "+f.pkg+" → "+f.fix,repo:f.repo,status:"open",auto:true});
      closeDrawer();state.screen="prs";render();toast("Auto-PR de bump criado.");break}
    case "sel-doc": state.docSel=i;render();break;
    case "toggle-pr": {const p=state.prs.find(x=>x.id===id);p.auto=!p.auto;render();break}
    case "del-pr": {const idx=state.prs.findIndex(x=>x.id===id);const p=state.prs.splice(idx,1)[0];
      render();toast("PR removido.",()=>{state.prs.splice(idx,0,p)});break}
    case "zoom-in": state.graph.zoom=clamp(state.graph.zoom*1.25,.3,4);break;
    case "zoom-out": state.graph.zoom=clamp(state.graph.zoom/1.25,.3,4);break;
    case "zoom-reset": state.graph.zoom=1;state.graph.px=0;state.graph.py=0;break;
    case "noop": t.classList.toggle("on");break;
    case "pal-run": {const a=palFiltered[i];closePalette();if(a)a.fn();break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.pref){
    const k=t.dataset.pref;
    state[k]=t.type==="checkbox"?t.checked:t.type==="range"?+t.value:t.value;
    applyPrefs();return;
  }
  const inp=t.dataset.inp;
  if(inp==="repo-search"){state.repoSearch=t.value;
    const tb=$("#main tbody");if(tb){/* re-render leve da tabela */ render();const s=$("#repoSearch");s.focus();s.setSelectionRange(s.value.length,s.value.length)}return}
  if(inp==="doc-search"){state.docSearch=t.value;state.docSel=0;render();const s=$("#main [data-inp=doc-search]");if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}return}
  if(inp==="slice-max"){state.sliceMax=+t.value;state.sliceExecuted=false;render();return}
  if(inp==="cron"){const p=state.policies.find(x=>x.id===+t.dataset.id);if(p){p.cron=t.value;persist();
    const out=t.closest(".field").querySelector("output");if(out)out.textContent=cronNext(t.value)}return}
  if(inp==="driver"){state.driver=t.value;render();return}
  if(inp==="repo-url"){const r=state.repos.find(x=>x.id===+t.dataset.id);if(r){r.url=t.value;persist()}return}
  if(inp==="repo-mode-edit"){const r=state.repos.find(x=>x.id===+t.dataset.id);if(r){r.mode=t.value;persist();render()}return}
  if(inp==="sel"){const id=+t.dataset.id;t.checked?state.selection.add(id):state.selection.delete(id);render();return}
  if(inp==="sel-all"){const rows=filteredRepos();t.checked?rows.forEach(r=>state.selection.add(r.id)):state.selection.clear();render();return}
  if(t.id==="palInput"){state.palIdx=0;renderPalette(t.value);return}
});
/* drag reorder repos */
let dragId=null;
document.addEventListener("dragstart",e=>{const tr=e.target.closest("tr[draggable]");if(tr){dragId=+tr.dataset.id;tr.classList.add("dragging")}});
document.addEventListener("dragend",e=>{const tr=e.target.closest("tr[draggable]");if(tr)tr.classList.remove("dragging");dragId=null});
document.addEventListener("dragover",e=>{if(e.target.closest("tr[draggable]"))e.preventDefault()});
document.addEventListener("drop",e=>{
  const tr=e.target.closest("tr[draggable]");if(!tr||dragId==null)return;e.preventDefault();
  const target=+tr.dataset.id;if(target===dragId)return;
  const from=state.repos.findIndex(r=>r.id===dragId),to=state.repos.findIndex(r=>r.id===target);
  const [m]=state.repos.splice(from,1);state.repos.splice(to,0,m);persist();render();toast("Ordem atualizada.");
});
/* graph interaction */
document.addEventListener("pointerdown",e=>{
  const cv=e.target.closest("#graphCanvas");if(!cv)return;
  state.graph.drag={x:e.clientX,y:e.clientY,px:state.graph.px,py:state.graph.py};
  cv.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  const cv=e.target.closest("#graphCanvas");
  if(state.graph.drag&&cv){state.graph.px=state.graph.drag.px+(e.clientX-state.graph.drag.x);
    state.graph.py=state.graph.drag.py+(e.clientY-state.graph.drag.y);return}
  if(cv){
    const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    const w=cv.width/dpr,h=cv.height/dpr;
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    const cx=w/2+state.graph.px,cy=h/2+state.graph.py,z=state.graph.zoom;
    let best=null,bd=14;
    for(let i=0;i<state.nodes;i++){const n=GNODES[i];
      const d=Math.hypot(cx+n.x*z-mx,cy+n.y*z-my);if(d<bd){bd=d;best=i}}
    state.graph.hover=best;
    const tip=$("#gtip");
    if(tip){if(best!=null){const n=GNODES[best];
      tip.innerHTML=`<div class="tt-t">${esc(n.name)}</div><div class="tt-m">cluster ${n.c} · ${n.hub?"hub":"nó"}<br>3 findings · CVE-2026-1183</div>`;
      tip.style.left=clamp(mx+14,0,r.width-230)+"px";tip.style.top=clamp(my+10,0,r.height-80)+"px";
      tip.classList.add("show")}else tip.classList.remove("show")}
  }
});
document.addEventListener("pointerup",()=>{state.graph.drag=null});
/* hover/clique no grafo de branches */
document.addEventListener("pointermove",e=>{
  const cv=e.target.closest("#branchCanvas");if(!cv)return;
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const g=buildBranchGraph(state.branchRepo);
  const cy=170+8,X=x=>66+x*88,Y=l=>cy+l*54;
  let best=null,bd=16;
  g.commits.forEach((c,i)=>{const d=Math.hypot(X(c.x)-mx,Y(c.lane)-my);if(d<bd){bd=d;best=i}});
  state.branchHover=best;
  const tip=$("#btip");
  if(tip){if(best!=null){const c=g.commits[best];
    tip.innerHTML=`<div class="tt-t">${esc(c.l)} · ${esc(c.branch)}</div><div class="tt-m">${esc(c.sha)} · ${esc(c.who)}<br>${esc(c.msg)}</div>`;
    tip.style.left=clamp(mx+14,0,r.width-230)+"px";tip.style.top=clamp(my+8,0,r.height-70)+"px";
    tip.classList.add("show")}else tip.classList.remove("show")}
});
document.addEventListener("click",e=>{
  const cv=e.target.closest("#branchCanvas");if(!cv||state.branchHover==null)return;
  const g=buildBranchGraph(state.branchRepo),c=g.commits[state.branchHover];
  openDrawer(`<div class="dh"><h2 class="mono">${esc(c.sha)}</h2><button class="btn sm ghost" data-act="close-drawer">${icon("x",14)}</button></div>
    <div class="chips" style="margin-bottom:12px"><span class="chip mono" style="color:${cssVar(c.color)};border-color:${cssVar(c.color)}">${esc(c.branch)}</span>
    ${c.tags.map(t=>`<span class="chip on">${esc(t)}</span>`).join("")}</div>
    <div class="cas">commit ${esc(c.l)} · ${esc(c.who)}<br>${esc(c.msg)}</div>
    <p style="font-size:.8rem;color:var(--mu);margin-bottom:12px">Branching determinístico · merge só via PR com gate.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm primary" data-act="slice-repo" data-id="">${icon("slice",13)} Slice commit</button>
      <button class="btn sm" data-act="nav" data-screen="branches">${icon("branch",13)} Ver grafo</button></div>`);
});
document.addEventListener("wheel",e=>{
  if(e.target.closest("#graphCanvas")){e.preventDefault();
    state.graph.zoom=clamp(state.graph.zoom*(e.deltaY<0?1.1:0.9),.3,4)}
},{passive:false});
/* ripple micro-interaction */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.nav-item,.chip");if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height);
  const sp=document.createElement("span");sp.className="ripple";
  sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  b.appendChild(sp);setTimeout(()=>sp.remove(),600);
});
/* menu hambúrguer (abre/fecha) */
function toggleNav(){
  const nav=$("#nav"),open=!nav.classList.contains("open");
  nav.classList.toggle("open",open);
  document.body.classList.toggle("nav-open",open);
  $("#scrim").classList.toggle("show",open||$("#drawer").classList.contains("open"));
  $("#burger").setAttribute("aria-expanded",open?"true":"false");
  $("#burger").setAttribute("aria-label",open?"Fechar menu":"Abrir menu");
}
function closeNav(){
  if(!$("#nav").classList.contains("open"))return;
  $("#nav").classList.remove("open");document.body.classList.remove("nav-open");
  if(!$("#drawer").classList.contains("open")&&!document.body.classList.contains("studio-open"))$("#scrim").classList.remove("show");
  $("#burger").setAttribute("aria-expanded","false");
}
/* estúdio como bottom-sheet no mobile (abre/fecha) */
function toggleStudio(){
  const open=!document.body.classList.contains("studio-open");
  document.body.classList.toggle("studio-open",open);
  $("#scrim").classList.toggle("show",open||$("#nav").classList.contains("open")||$("#drawer").classList.contains("open"));
  const b=$(".studio-btn");if(b)b.setAttribute("aria-expanded",open?"true":"false");
}
function closeStudio(){
  if(!document.body.classList.contains("studio-open"))return;
  document.body.classList.remove("studio-open");
  const b=$(".studio-btn");if(b)b.setAttribute("aria-expanded","false");
  if(!$("#drawer").classList.contains("open")&&!$("#nav").classList.contains("open"))$("#scrim").classList.remove("show");
}
/* keyboard */
document.addEventListener("keydown",e=>{
  const inField=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(!inField&&(e.key==="Enter"||e.key===" ")&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.act){
    e.preventDefault();document.activeElement.click();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&!inField){e.preventDefault();doUndo();return}
  if(e.key==="Escape"){closePalette();closeModal();closeDrawer();closeNav();closeStudio();return}
  if($("#palette").classList.contains("open")){
    if(e.key==="ArrowDown"){e.preventDefault();state.palIdx=clamp(state.palIdx+1,0,palFiltered.length-1);renderPalette($("#palInput").value)}
    if(e.key==="ArrowUp"){e.preventDefault();state.palIdx=clamp(state.palIdx-1,0,palFiltered.length-1);renderPalette($("#palInput").value)}
    if(e.key==="Enter"){const a=palFiltered[state.palIdx];closePalette();if(a)a.fn()}
    return;
  }
  if(inField)return;
  if(e.key==="/"){e.preventDefault();openPalette();return}
  const n=parseInt(e.key);if(n>=1&&n<=NAV.length){state.screen=NAV[n-1][0];render()}
});
window.addEventListener("resize",()=>sizeCanvases());

/* ═══════════════════════ TICK (SSE simulado) ═══════════════════════ */
setInterval(()=>{
  state.rss=clamp(state.rss+Math.round(rnd(-14,16)),300,640);
  state.jobs.forEach(j=>{j.p+=Math.round(rnd(1,7));if(j.p>=100){j.p=0;
    state.events.unshift({t:now(),k:j.kind+".done",m:j.repo,c:j.c})}});
  if(Math.random()<.4&&state.repos.length)state.events.unshift({t:now(),k:pick(["sync.ok","gate.pass","cve.match","fetch"]),
    m:pick(state.repos).name+" · "+hash(String(now())).slice(0,7),c:pick(["var(--d5)","var(--d3)","var(--d6)","var(--d1)"])});
  state.events=state.events.slice(0,40);
  const pill=$("#govPill");pill.classList.toggle("warn",state.rss>600*.8);
  $("#govTxt").textContent=state.rss+"/600 MB";
  const rn=$("#rssNum");if(rn)rn.textContent=state.rss;
  const arc=$("#govArc");if(arc){const p=clamp(state.rss/600,0,1);
    arc.setAttribute("d",`M6,26 A26,26 0 ${p>.5?1:0} 1 ${6+52*p},26`);
    arc.setAttribute("stroke",state.rss>480?"var(--wa)":"var(--ok)")}
  const gb=$("#govBar");if(gb){gb.style.width=clamp(state.rss/600*100,0,100)+"%";
    gb.style.background=state.rss>480?"var(--wa)":"var(--ok)";$("#govBarV").textContent=state.rss}
  const feed=$("#feed");if(feed)feed.innerHTML=feedHTML();
  const jobs=$("#jobs");if(jobs)jobs.innerHTML=jobsHTML();
},1400);

/* ═══════════════════════ BOOT ═══════════════════════ */
seed();
restoreRealRepos();
renderThemeDots();
renderStudio();
render();
realScan();
requestAnimationFrame(loop);
