[package]
name = "colmeia"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Gestor Git de frotas, TUI-first, automação determinística em hardware mínimo"
authors = ["Colmeia App Team"]

[lib]
name = "colmeia"
path = "src/lib.rs"

[[bin]]
name = "colmeia"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.27"
ratatui = "0.26"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
dirs = "5"
libc = "0.2"
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
miniz_oxide = "0.7"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
