name: Release multi-plataforma

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Validação (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testes Rust (lib + integração)
        run: cargo test --locked
      - name: Smoke test da Web GUI
        run: node web/smoke-test.mjs
      # api-test.mjs valida o diretório REAL de repos da máquina do
      # desenvolvedor; no CI usamos uma fixture sintética com as mesmas
      # garantias (listagem, repo info, read-only, anti-traversal).
      - name: Testes da API de exploração (fixture)
        shell: bash
        run: |
          FIX="$RUNNER_TEMP/colmeia-fixture"
          mkdir -p "$FIX/repos/projects/demo"
          git init -q "$FIX/repos/alpha"
          git init -q "$FIX/repos/projects/demo/beta"
          git -C "$FIX/repos/alpha" config user.email t@t
          git -C "$FIX/repos/alpha" config user.name t
          touch "$FIX/repos/alpha/a.txt"
          git -C "$FIX/repos/alpha" add . && git -C "$FIX/repos/alpha" commit -q -m init
          node --version; curl --version | head -1
          COLMEIA_REPOS_ROOT="$FIX/repos" node scripts/dev-server.mjs --port 7199 &
          # Espera ativa (runners podem demorar mais que 3s para o node responder)
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:7199/api/tree?path=" > /tmp/tree-root.json 2>/tmp/curl-err; then break; fi
            sleep 1
          done
          echo "--- resposta /api/tree?path=:"; cat /tmp/tree-root.json || true
          echo; echo "--- erro curl (se houver):"; cat /tmp/curl-err || true; echo
          grep -q '"alpha"' /tmp/tree-root.json
          curl -sf "http://127.0.0.1:7199/api/tree?path=projects" | grep -q '"demo"'
          curl -sf "http://127.0.0.1:7199/api/repo?path=alpha" | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:7199/api/repo?path=..')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://127.0.0.1:7199/api/tree')" = "405"

  build:
    name: Build release (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: colmeia
            pkg: colmeia-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: colmeia
            pkg: colmeia-macos-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: colmeia.exe
            pkg: colmeia-windows-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: colmeia
            pkg: colmeia-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empacotar (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp -r web dist/web
          tar -czf dist/${{ matrix.pkg }} -C dist ${{ matrix.bin }} web
      - name: Empacotar (zip)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\${{ matrix.bin }} dist\
          xcopy /E /I web dist\web
          Compress-Archive -Path dist\${{ matrix.bin }},dist\web -DestinationPath dist\${{ matrix.pkg }}
      - name: Upload de artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: dist/${{ matrix.pkg }}

  release:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Criar release com os binários
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
